version: '3.9'

services:
  backend:
    build: ./backend
    container_name: nuzul-backend
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app   # hot-reload in dev
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nuzul-frontend
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped

